<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · Smart IoT</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-body"><main class="auth-shell"><section class="auth-panel"><a class="brand" href="index.html"><span class="brand-mark">SI</span><span>Smart IoT</span></a><div class="auth-card"><div class="eyebrow">SECURE ACCESS</div><h1>Welcome back</h1><p>Login to access your IoT Dashboard.</p><form id="login-form"><label>Email Address<input id="login-email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<div class="password-wrap"><input id="login-password" type="password" autocomplete="current-password" minlength="6" required placeholder="Your password"><button type="button" data-password-toggle="login-password">Show</button></div></label><div id="login-error" class="form-error" role="alert"></div><button id="login-btn" class="btn btn-primary btn-full" type="submit"><span>LOGIN</span></button></form><div class="or"><span>OR</span></div><button id="google-btn" class="btn btn-secondary btn-full" type="button">Continue with Google</button><p class="auth-switch">Don't have an account? <a href="signup.html">Create Account</a></p></div></section><aside class="auth-art"><div class="art-grid"></div><div><div class="eyebrow">REAL-TIME IOT</div><h2>See your environment<br>as it changes.</h2><p>Live sensor streams, cloud control and automation in one responsive workspace.</p></div><div class="mini-metrics"><span><b>24.5°C</b>Temp</span><span><b>49%</b>Humidity</span><span><b>420</b>LDR</span></div></aside></main><script type="module" src="js/auth.js"></script></body></html>
