<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="32" cy="32" r="18" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="80 30" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="7" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="32" cy="14" r="3" fill="#38bdf8"/>
  <line x1="32" y1="17" x2="32" y2="25" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
</svg>
