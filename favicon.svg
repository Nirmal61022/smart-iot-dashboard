<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#fdba74" stroke-width="2"/>
  <circle cx="32" cy="32" r="18" stroke="url(#orangeGrad)" stroke-width="3.5" stroke-dasharray="80 30" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="7" fill="#ea580c" filter="url(#glow)"/>
  <circle cx="32" cy="14" r="3.5" fill="#f97316"/>
  <line x1="32" y1="17" x2="32" y2="25" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round"/>
</svg>
