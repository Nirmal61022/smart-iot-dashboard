<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account · Smart IoT</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-body"><main class="auth-shell"><section class="auth-panel"><a class="brand" href="index.html"><span class="brand-mark">SI</span><span>Smart IoT</span></a><div class="auth-card"><div class="eyebrow">OPEN REGISTRATION</div><h1>Create your account</h1><p>Use your own email and password. No predefined account is required.</p><form id="signup-form"><label>Email Address<input id="signup-email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<div class="password-wrap"><input id="signup-password" type="password" autocomplete="new-password" minlength="6" required placeholder="At least 6 characters"><button type="button" data-password-toggle="signup-password">Show</button></div></label><label>Confirm Password<div class="password-wrap"><input id="signup-confirm" type="password" autocomplete="new-password" minlength="6" required placeholder="Repeat your password"><button type="button" data-password-toggle="signup-confirm">Show</button></div></label><div id="signup-error" class="form-error" role="alert"></div><button id="signup-btn" class="btn btn-primary btn-full" type="submit">CREATE ACCOUNT</button></form><p class="auth-switch">Already have an account? <a href="login.html">Login</a></p></div></section><aside class="auth-art signup-art"><div class="art-grid"></div><div><div class="eyebrow">YOUR IOT WORKSPACE</div><h2>Connect sensors.<br>Automate decisions.</h2><p>Firebase Authentication keeps account access separate from device data access.</p></div></aside></main><script type="module" src="js/auth.js"></script></body></html>
